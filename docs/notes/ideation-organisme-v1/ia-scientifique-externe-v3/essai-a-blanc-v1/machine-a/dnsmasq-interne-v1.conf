# Serveur de noms du réseau interne agsci-interne-v1 (machine A), v1 — session-depot, 30 octobre 2026 (R-808).
# Tout nom → le mandataire (172.30.0.2), sauf « relais » → le passe-relais (172.30.0.3) et « mandataire » → lui-même.
# Ainsi même les outils qui ignorent HTTPS_PROXY (installation des dépendances de la tâche, Node `fetch`, figures après
# effacement d'environnement) passent par le mandataire, seul membre à deux pattes. Aucune réponse AAAA (IPv6 coupé).
no-resolv
no-hosts
listen-address=172.30.0.4
bind-interfaces
log-queries
log-facility=/journal/dns-v1.log
address=/relais/172.30.0.3
address=/mandataire/172.30.0.2
address=/#/172.30.0.2
filter-AAAA
